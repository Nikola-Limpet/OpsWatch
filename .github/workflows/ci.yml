name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - run: uv run ruff check src scripts tests api
      - run: uv run ruff format --check src scripts tests api
      - run: node --check src/opswatch/dashboard_assets/app.js
      - run: node --test tests/dashboard-workspace.test.cjs
