[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opswatch"
version = "0.1.0"
description = "Local development operations monitor with Telegram and Hermes diagnosis"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "psycopg[binary]>=3.2,<4",
  "mcp>=1.12,<2",
  "starlette>=0.47,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
opswatch = "opswatch.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
